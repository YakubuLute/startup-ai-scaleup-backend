# Render Blueprint - https://render.com/docs/blueprint-spec
services:
  - type: web
    name: agrico-hub-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --log-file -
    envVars:
      - key: FLASK_APP
        value: run.py
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: agrico-hub-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.0

databases:
  - name: agrico-hub-db
    plan: free
    ipAllowList: []